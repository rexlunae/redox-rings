[package]
name = "redox-rings"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "sync", "userspace"]
std = ["libredox"]
sync = []
userspace = []

[dependencies]
libredox = { version = "0.1.18", default-features = false, features = ["redox_syscall", "call"], optional = true}
redox_syscall = "0.9.0"
zerocopy = { version = "0.8.55", features = ["derive"] }
bitflags = "2.13.1"

# The wait-protocol model checks in `sync::tests` (`RUSTFLAGS="--cfg loom" cargo test --lib`);
# loom is MIT. A dev-dependency, so it stays out of the lockfiles of crates that use this one.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
